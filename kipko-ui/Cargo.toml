[package]
name = "kipko-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core workspace dependencies
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["js", "serde"] }
chrono = { workspace = true, features = ["serde", "wasmbind"] }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Leptos dependencies
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_actix = { workspace = true, optional = true }

# WebAssembly dependencies
wasm-bindgen = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
console_error_panic_hook = { workspace = true }
gloo-net = { workspace = true, features = ["http"] }
gloo-storage = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
getrandom = { version = "0.2", features = ["js"] }

# Internal dependencies
kipko-core = { path = "../kipko-core", default-features = false, features = [] }

# QR code generation
qrcode = "0.14"
base64 = "0.21"

[features]
default = ["leptos_actix"]
hydrate = ["leptos/hydrate", "leptos_meta/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_actix"]
