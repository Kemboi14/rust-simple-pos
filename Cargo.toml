[workspace]
resolver = "3"
members = [
    "kipko-core",
    "kipko-server",
    "kipko-ui"
]

[workspace.dependencies]
# Core dependencies
rust_decimal = "1.34"
rust_decimal_macros = "1.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Database dependencies
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }

# Server dependencies (Actix-web instead of Axum)
actix-web = "4.4"
actix-cors = "0.6"
actix-rt = "2.9"
tokio = { version = "1.35", features = ["full"] }

# UI dependencies (Leptos instead of Dioxus)
leptos = "0.6"
leptos_actix = "0.6"
leptos_meta = "0.6"
wasm-bindgen = "0.2"
console_log = "1.0"
log = "0.4"
console_error_panic_hook = "0.1.7"
gloo-net = "0.5"
gloo-storage = "0.3"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# Testing dependencies
proptest = "1.4"
